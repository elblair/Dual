# Render Blueprint for Dual: the API (a web service) and the web app (a static site). Free tier, Oregon.
# Render > New + > Blueprint > pick this repo. Render asks for DATABASE_URL (the Neon string); everything else is filled in.
# Never put real secrets in this file.
services:
  - type: web
    name: dual-api
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false # asked for in the dashboard: paste the Neon connection string there
      - key: JWT_SECRET
        generateValue: true # Render makes a long random string
      - key: CORS_ORIGINS
        sync: false # set in the dashboard: the web app's URL plus localhost (docs/RENDER_WEB.md). Left unset it allows every origin.
      - key: BREVO_API_KEY
        sync: false # Brevo API key for the sign-up codes (docs/EMAIL.md). Left unset, codes only go to the server log.
      - key: EMAIL_FROM
        sync: false # the sender address you verified in Brevo

  # The web app (Expo web export, a single-page app). Free static site: it never sleeps. Auto-deploys from main.
  # EXPO_PUBLIC_* values are inlined at BUILD time, so changing one means a redeploy. Never put secrets here.
  - type: web
    name: dual-web
    runtime: static
    plan: free
    branch: main
    rootDir: app
    buildCommand: npm ci && npx expo export --platform web
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: EXPO_PUBLIC_API_URL
        value: https://dual-api-memp.onrender.com
      - key: EXPO_PUBLIC_USE_MOCK
        value: "false"
    routes:
      # Deep links such as /duel/123 (and a reload on any screen) serve the app; the router then opens the right screen.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /manifest.json
        name: Cache-Control
        value: no-cache
